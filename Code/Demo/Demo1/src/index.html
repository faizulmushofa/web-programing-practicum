<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./dist/output.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-background">

    <!--Header Navigation-->
    <header class="bg-surface">
        <nav class="flex justify-between items-center py-4 text-text mr-3 ml-3">
            <div class="flex gap-1 items-center ">
                <a href="">
                    <img src="./images/logo.jpeg" alt="logo-image" class="w-8 h-8 object-cover rounded-2xl ">
                </a>
                <p>Flip Play</p>
            </div>

            <ul class="flex gap-4">
                <a href="#hero" class=" hover:text-card">Home</a>
                <a href="#watch-read" class=" hover:text-card">Discover</a>
                <a href="#features" class=" hover:text-card">Features</a>
                <a href="#categories" class=" hover:text-card">Categories</a>
            </ul>

            <div class="flex items-center gap-2">
                <button
                    class="rounded-lg px-3 py-2 bg-card border border-transparent text-background hover:border-white hover:text-white hover:bg-background">Sign
                    in</button>
                <button
                    class="border rounded-lg px-5 py-2 hover:border-transparent hover:bg-card hover:text-background hover:text-background">Explore</button>
                <a href="">
                    <i data-lucide="circle-user"></i>
                </a>
            </div>
        </nav>
    </header>

    <!--Hero-->
    <section id="hero" class="text-white mt-20 flex flex-col justify-center items-center gap-2">
        <div>
            Streaming & Reading Redefined
        </div>
        <div class="text-6xl font-bold text-center ">
            <h1>YOUR STORIES.</h1>
            <h1>ONE PLACE.</h1>
        </div>
        <div class="text-center">
            Anime,drama,manga, and light novels - all in one seamless entertainment <br>
            experience unified tracking,reading, and 4K playback
        </div>
        <div class="flex justify-center items-center gap-2 mt-1">
            <button class="border rounded-lg py-1 px-1 flex items-center gap-1">
                Explore FlipPlay
                <i data-lucide="arrow-right"></i>
            </button>
            <button class="rounded-lg border py-1 px-2 flex items-center gap-1">
                <i data-lucide="circle-play"></i>
                Discover More
            </button>
        </div>
        <div>
            
        </div>

    </section>

    <!--Categories-->
    <section id="categories">

    </section>

    <!--Watch Read-->
    <section id="watch-read">

    </section>

    <!--Trending-->
    <section id="trending">

    </section>

    <!--features-->
    <section id="features">

    </section>


    <!--CTA-->
    <section id="cta">

    </section>

    <footer>

    </footer>

<script src="js/script.js"></script>
